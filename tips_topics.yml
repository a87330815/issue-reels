# 생활·꿀팁 주제 시드 (tips_topics.yml)
#
# scriptgen.py --tips 모드에서 읽는다.
# LLM이 이 시드를 받아 완전히 새로운 대본을 생성하므로
# 외부 데이터/저작권 게이트가 불필요하다.
#
# 카테고리: 생활·꿀팁
# 형식: 각 시드는 topic(주제)과 angle(앵글 힌트)로 구성
#
# 주의:
#   - 정치·연예·스포츠 소재 금지
#   - 특정 브랜드 비교·광고성 금지
#   - 실용적이고 바로 써먹을 수 있는 팁 위주

formats:
  - 절약팁       # 돈 아끼는 생활 꿀팁
  - 생활해킹     # 일상을 편하게 바꾸는 방법
  - 계절팁       # 계절별로 알아두면 좋은 것
  - 건강팁       # 간단한 건강·위생 관리
  - 살림팁       # 집안일·청소·정리 노하우

seeds:
  # ── 절약·돈 관련 ──
  - topic: "통신비 절약"
    angle: "알뜰폰으로 바꾸면 월 3만 원 이상 아끼는 현실적인 방법"
    format: 절약팁

  - topic: "전기세 줄이기"
    angle: "대기전력 잡는 것만으로도 월 전기세 1만 원 절약하는 방법"
    format: 절약팁

  - topic: "식비 절약"
    angle: "장보기 전에 이것만 하면 식비 30% 줄어드는 습관"
    format: 절약팁

  - topic: "교통비 절약"
    angle: "환승 할인·정기권 제대로 활용하면 교통비 반으로 줄이는 법"
    format: 절약팁

  # ── 생활 해킹 ──
  - topic: "옷 관리"
    angle: "니트 보풀 제거부터 흰옷 누런 때 빼는 법까지"
    format: 생활해킹

  - topic: "신발 관리"
    angle: "운동화 흰색 복원하는 집에 있는 재료 활용법"
    format: 생활해킹

  - topic: "스마트폰 배터리"
    angle: "배터리 오래 쓰려면 반드시 알아야 할 충전 습관 3가지"
    format: 생활해킹

  - topic: "택배 반품"
    angle: "택배 반품할 때 손해 안 보는 꿀팁 정리"
    format: 생활해킹

  - topic: "이사 준비"
    angle: "이사할 때 버리기 아까운 물건 처리하는 현실적 방법"
    format: 생활해킹

  # ── 계절별 팁 ──
  - topic: "겨울철 결로"
    angle: "창문 물방울 맺히는 거 방치하면 곰팡이 — 초간단 해결법"
    format: 계절팁

  - topic: "여름 음식 보관"
    angle: "여름에 밥 상온 방치 몇 시간이 한계인지 + 보관 꿀팁"
    format: 계절팁

  - topic: "환절기 감기"
    angle: "환절기마다 감기 걸리는 사람이 놓치는 생활 습관 3가지"
    format: 건강팁

  # ── 청소·정리 ──
  - topic: "배수구 냄새"
    angle: "싱크대·욕실 배수구 냄새 잡는 5분 해결법"
    format: 살림팁

  - topic: "냉장고 정리"
    angle: "냉장고 칸별 최적 보관법 — 이렇게 넣으면 식재료 2배 오래 감"
    format: 살림팁

  - topic: "세탁기 청소"
    angle: "세탁기 곰팡이 냄새 원인과 한 달에 한 번 5분 청소법"
    format: 살림팁

  - topic: "옷장 정리"
    angle: "옷장 터지는 사람 필독 — 안 입는 옷 기준 잡는 법"
    format: 살림팁

  # ── 건강·위생 ──
  - topic: "수면 자세"
    angle: "자는 자세만 바꿔도 허리 통증 줄어드는 이유"
    format: 건강팁

  - topic: "손 씻기"
    angle: "30초 손 씻기가 감기 예방률 50% 높이는 과학적 이유"
    format: 건강팁

  - topic: "눈 건강"
    angle: "하루 종일 스마트폰 보는 사람이 꼭 해야 할 눈 스트레칭"
    format: 건강팁

  - topic: "물 마시기"
    angle: "하루 물 2리터 꼭 마셔야 하나? 실제 권장량과 제대로 마시는 법"
    format: 건강팁
