# 절약·재테크 꿀팁 주제 시드 (tips_topics.yml)
#
# scriptgen.py --tips 모드에서 읽는다.
# LLM이 이 시드를 받아 완전히 새로운 대본을 생성하므로
# 외부 데이터/저작권 게이트가 불필요하다.
#
# 카테고리: 세금·절약
# 형식: 각 시드는 topic(주제)과 angle(앵글 힌트)로 구성
#
# 주의:
#   - 연예·정치·스포츠·부동산 소재 금지
#   - 특정 금융상품 추천·"확정 수익"·"원금 보장" 표현 금지
#   - 실용적이고 바로 써먹을 수 있는 돈 관련 팁 위주

formats:
  - 절약팁       # 돈 아끼는 생활 꿀팁
  - 세금팁       # 세금·연말정산·공제 관련
  - 투자입문     # 초보자용 투자 기초 상식
  - 보험팁       # 보험 가입·점검·청구 꿀팁
  - 연금팁       # 국민연금·퇴직연금·개인연금 정보

seeds:
  # ── 절약 꿀팁 ──
  - topic: "통신비 절약"
    angle: "알뜰폰으로 바꾸면 월 3만 원 이상 아끼는 현실적인 방법"
    format: 절약팁

  - topic: "구독료 정리"
    angle: "안 쓰는 구독 서비스 한 번에 확인하고 해지하는 법"
    format: 절약팁

  - topic: "카드 혜택 최적화"
    angle: "카드 2장으로 할인 혜택 극대화하는 조합 전략"
    format: 절약팁

  - topic: "교통비 절약"
    angle: "환승 할인·기후동행카드·정기권 비교해서 교통비 반으로 줄이는 법"
    format: 절약팁

  - topic: "포인트 현금화"
    angle: "흩어진 포인트 모아서 현금처럼 쓰는 법 — 대부분 모르고 버림"
    format: 절약팁

  # ── 세금·연말정산 ──
  - topic: "연말정산 기초"
    angle: "소득공제 vs 세액공제 차이 — 이것만 알면 연말정산 반은 끝"
    format: 세금팁

  - topic: "월세 세액공제"
    angle: "월세 내는 사람이 연말정산에서 돌려받을 수 있는 금액"
    format: 세금팁

  - topic: "의료비 공제"
    angle: "병원비·약국비 연말정산 공제 받으려면 꼭 챙겨야 할 것"
    format: 세금팁

  - topic: "종합소득세 기초"
    angle: "투잡·부업 소득 있으면 5월에 꼭 해야 하는 것"
    format: 세금팁

  - topic: "부양가족 공제"
    angle: "부모님 부양가족 등록하면 150만 원 공제 — 조건 정리"
    format: 세금팁

  # ── 투자 입문 ──
  - topic: "적금 vs 예금"
    angle: "적금이랑 예금 뭐가 다른지 아직도 헷갈리는 사람을 위한 정리"
    format: 투자입문

  - topic: "ETF 기초"
    angle: "주식은 무서운데 ETF는 괜찮다는 이유 — 초보 3분 정리"
    format: 투자입문

  - topic: "ISA 계좌"
    angle: "ISA 계좌 하나면 비과세 혜택 받으면서 투자하는 법"
    format: 투자입문

  - topic: "금리 이해"
    angle: "기준금리 오르면 내 적금 이자도 오르는 건지 정리"
    format: 투자입문

  - topic: "72법칙"
    angle: "내 돈 2배 되는 데 몇 년 걸리는지 3초 만에 계산하는 법"
    format: 투자입문

  - topic: "CMA 통장"
    angle: "돈 넣어두기만 해도 이자 붙는 CMA 통장 — 일반 통장과 차이"
    format: 투자입문

  # ── 보험 꿀팁 ──
  - topic: "실손보험 청구"
    angle: "실손보험 청구 안 하고 넘어가는 항목 — 돈 버리는 습관"
    format: 보험팁

  - topic: "보험 리모델링"
    angle: "10년 전 보험 그대로 유지하면 손해인 이유 — 점검 체크리스트"
    format: 보험팁

  - topic: "보험 중복 확인"
    angle: "내가 가입한 보험 한 눈에 확인하는 방법 — 내보험 다보여"
    format: 보험팁

  - topic: "자동차보험 절약"
    angle: "자동차보험 갱신할 때 비교견적 한 번이면 20% 절약 가능"
    format: 보험팁

  - topic: "보험금 청구 시효"
    angle: "보험금 청구 시효 3년 — 모르고 지나치면 못 받는 돈"
    format: 보험팁

  # ── 연금·노후 ──
  - topic: "국민연금 수령액"
    angle: "내 국민연금 예상 수령액 확인하는 법 — 1분이면 끝"
    format: 연금팁

  - topic: "퇴직연금 IRP"
    angle: "퇴직금 IRP에 넣으면 세금 아끼는 구조 — 그냥 받으면 손해"
    format: 연금팁

  - topic: "연금저축 세액공제"
    angle: "연금저축 넣으면 연말정산에서 최대 99만 원 돌려받는 구조"
    format: 연금팁

  - topic: "국민연금 조기수령"
    angle: "국민연금 5년 일찍 받으면 얼마나 깎이는지 계산해보면"
    format: 연금팁

  - topic: "연금 3층 구조"
    angle: "국민연금·퇴직연금·개인연금 3층 구조 — 왜 3개 다 필요한지"
    format: 연금팁
