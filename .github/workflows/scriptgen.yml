name: 대본 생성
on:
  schedule:
    # KST 07:15, 13:15에 허용 분야 대본을 채워 다섯 발행 슬롯의 버퍼를 만든다.
    - cron: "15 22 * * *"
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: 생성할 대본 수
        type: string
        default: "9"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: rm -f out/scripts/*.json
      - name: 자료 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: |
          python collect.py || true
          python collect_trends.py || true
      - name: 생성 및 검증
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          python scriptgen.py -n "${{ inputs.count || '9' }}" --trends out/trends.json
          python - <<'PY'
          import glob,json,os
          allowed={'연예','국내 정치','해외 정치','경제','해외연예'}
          banned=('생활꿀팁','생활·꿀팁','꿀팁','일반 정보','아파트','부동산','실거래','분양','청약','전세','월세','주택','평당','단지','집값','주거','재건축','매매가')
          kept=[]
          for p in glob.glob('out/scripts/*.json'):
              d=json.load(open(p,encoding='utf-8')); t=json.dumps(d,ensure_ascii=False)
              category=(d.get('meta') or {}).get('category','').strip()
              scenes=d.get('scenes') or []
              source=(d.get('meta') or {}).get('attribution') or (d.get('meta') or {}).get('source')
              reason=None
              if category not in allowed: reason=f'허용 외 카테고리: {category}'
              elif any(x in t for x in banned): reason='금지 주제 포함'
              elif len(scenes)!=5: reason=f'본문 장면 {len(scenes)}개 (5개 필요)'
              elif not source: reason='출처 없음'
              if reason:
                  print('제외:',os.path.basename(p),reason); os.remove(p)
              else: kept.append(p)
          print('검증 통과:',len(kept),'건')
          if not kept: raise SystemExit('허용 분야·5장 본문·출처 조건을 충족한 대본이 없습니다')
          PY
      - name: 사투리 변환 (dialect.py)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          for f in out/scripts/*.json; do
            [ -f "$f" ] || continue
            echo "변환: $(basename "$f")"
            python dialect.py "$f"
          done
      - name: 대본 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f out/scripts/
          git diff --cached --quiet && exit 0
          git commit -m "허용 분야 5종·본문 5장·출처 검증 대본 생성"
          git push origin main
