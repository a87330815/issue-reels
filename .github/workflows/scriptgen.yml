name: 대본 생성

on:
  workflow_run:
    workflows: ["수집"]
    types: [completed]
  workflow_dispatch:

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install PyYAML requests anthropic

      - name: 수집 데이터 다운로드
        uses: actions/download-artifact@v4
        with:
          name: collected
          path: out/
        continue-on-error: true

      - name: 수집 데이터 확인
        run: |
          if [ ! -f out/collected.json ]; then
            echo "수집 데이터 없음 — 직접 수집 실행"
            pip install -r requirements.txt
            python collect.py || echo "수집 실패 (인증키 미설정일 수 있음)"
          fi
          if [ -f out/collected.json ]; then
            echo "수집 데이터: $(python -c "import json; d=json.load(open('out/collected.json')); print(len(d.get('items',[])))") 건"
          fi

      - name: 대본 생성
        env:
          # 둘 중 설정된 쪽을 쓴다. 둘 다 있으면 LLM_PROVIDER로 고른다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          python scriptgen.py -n 3
          ls -la out/scripts/

      - name: 대본 업로드
        uses: actions/upload-artifact@v4
        with:
          name: scripts
          path: out/scripts/*.json
          retention-days: 30

      - name: 대본 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/scripts/
          git diff --cached --quiet || git commit -m "대본 생성 $(date +%Y-%m-%d)"
          git push || echo "push 실패 (권한 확인 필요)"
