name: 대본 생성
on:
  workflow_dispatch:
    inputs:
      count:
        description: 생성할 대본 수
        type: string
        default: "9"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: rm -f out/scripts/*.json
      - name: 자료 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: |
          python collect.py || true
          python collect_trends.py || true
      - name: 생성 및 검증
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          python scriptgen.py -n "${{ inputs.count || '9' }}" --trends out/trends.json
          python - <<'PY'
          import glob,json,os
          banned=('아파트','부동산','실거래','분양','청약','전세','월세','주택','평당','단지','집값','주거','재건축','매매가')
          kept=[]
          for p in glob.glob('out/scripts/*.json'):
              d=json.load(open(p,encoding='utf-8')); t=json.dumps(d,ensure_ascii=False)
              if any(x in t for x in banned): os.remove(p)
              else: kept.append(p)
          print('검증 통과:',len(kept),'건')
          if not kept: raise SystemExit('아파트·부동산·실거래 외 대본이 없습니다')
          PY
      - name: 대본 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f out/scripts/
          git diff --cached --quiet && exit 0
          git commit -m "아파트 부동산 실거래만 제외"
          git push origin main
