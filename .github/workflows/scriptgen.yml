name: 대본 생성

on:
  workflow_run:
    workflows: ["collect"]
    types: [completed]
  workflow_dispatch:
    inputs:
      count:
        description: "허용 주제 대본 수"
        type: string
        default: "9"
      fun_count:
        description: "사용 안 함"
        type: string
        default: "0"
      tips_count:
        description: "사용 안 함"
        type: string
        default: "0"
permissions:
  contents: write
jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 의존성 설치
        run: pip install PyYAML requests anthropic
      - name: 기존 대본 전체 삭제
        run: rm -f out/scripts/*.json
      - name: 새 자료 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: |
          pip install -r requirements.txt
          python collect.py || true
          python collect_trends.py || true
      - name: 허용 주제 대본 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: |
          python scriptgen.py -n "${{ inputs.count || '9' }}" --trends out/trends.json
          python - <<'PY'
          import json, glob, os
          allowed = {'연예','국내 정치','해외 정치','경제','해외연예'}
          aliases = {
              '정치':'국내 정치', '정치·시사':'국내 정치',
              '세계경제':'해외 정치', '글로벌경제':'해외 정치',
              '국제경제':'해외 정치', '해외경제':'해외 정치',
              '물가':'경제', '주거':'경제', '부동산':'경제',
              '경제·부동산':'경제', '경제·돈':'경제',
          }
          for p in glob.glob('out/scripts/*.json'):
              with open(p, encoding='utf-8') as f: d=json.load(f)
              meta=d.setdefault('meta',{})
              c=meta.get('category','').strip()
              if c in aliases:
                  c=aliases[c]
                  meta['category']=c
              if c not in allowed:
                  os.remove(p)
          PY
          ls -la out/scripts/
      - name: 대본 업로드
        uses: actions/upload-artifact@v4
        with:
          name: scripts
          path: out/scripts/*.json
          retention-days: 30
      - name: 대본 커밋
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f out/scripts/
          git diff --cached --quiet && { echo "커밋할 변경 없음"; exit 0; }
          git commit -m "허용 주제 대본 재수집 $(date +%Y-%m-%d\ %H:%M)"
          git pull --rebase --autostash origin main
          git push origin main
