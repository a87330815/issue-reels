name: 대본 생성

on:
  workflow_run:
    # 이름이 정확히 같아야 걸린다. 수집 워크플로의 name은 "collect"이고
    # 여기에 "수집"이라고 적혀 있어서 체인이 한 번도 이어지지 않았다.
    workflows: ["collect"]
    types: [completed]
  workflow_dispatch:
    inputs:
      count:
        description: "생성할 대본 수 (버퍼용으로 넉넉히)"
        type: string
        default: "9"

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install PyYAML requests anthropic

      # 수집 워크플로가 collected.json을 저장소에 커밋하므로 체크아웃만으로
      # 이미 들어와 있다. 다른 런의 아티팩트는 run-id 없이는 집히지 않아
      # 늘 조용히 실패했다. 남은 경우를 위해 아래 확인 단계가 직접 수집한다.
      - name: 수집 데이터 확인
        env:
          # 폴백으로 직접 수집할 때 인증키가 없으면 그대로 빈손이 된다.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: |
          if [ ! -f out/collected.json ]; then
            echo "수집 데이터 없음 — 직접 수집 실행"
            pip install -r requirements.txt
            python collect.py || echo "수집 실패 (인증키 미설정일 수 있음)"
          fi
          if [ -f out/collected.json ]; then
            echo "수집 데이터: $(python -c "import json; d=json.load(open('out/collected.json')); print(len(d.get('items',[])))") 건"
          fi

      - name: 대본 생성
        env:
          # 둘 중 설정된 쪽을 쓴다. 둘 다 있으면 LLM_PROVIDER로 고른다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          COUNT: ${{ inputs.count || '9' }}
        run: |
          # 해외 IP 차단이 간헐적이라 수집이 뚫린 날 며칠치를 만들어둔다.
          # 하루 3건 발행이므로 9편이면 사흘치다.
          python scriptgen.py -n "${COUNT:-9}"
          ls -la out/scripts/

      - name: 대본 업로드
        uses: actions/upload-artifact@v4
        with:
          name: scripts
          path: out/scripts/*.json
          retention-days: 30

      - name: 대본 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out/scripts/
          git diff --cached --quiet || git commit -m "대본 생성 $(date +%Y-%m-%d)"
          git push || echo "push 실패 (권한 확인 필요)"
