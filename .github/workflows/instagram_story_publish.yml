name: 인스타그램 스토리 발행

on:
  workflow_dispatch:
  push:
    paths:
      - ".instagram_story_trigger"

permissions:
  contents: write

jobs:
  publish-instagram-story:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 의존성 설치
        run: pip install -q requests

      - name: 페이지 장기토큰 선택
        id: ig_token
        env:
          USER_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID }}
        run: |
          python - <<'PY'
          import os, requests
          user_token = os.environ["USER_TOKEN"]
          ig_id = os.environ["IG_USER_ID"]
          r = requests.get(
              "https://graph.facebook.com/v26.0/me/accounts",
              params={
                  "fields": "id,name,access_token,instagram_business_account",
                  "limit": 100,
                  "access_token": user_token,
              },
              timeout=30,
          )
          data = r.json()
          if "error" in data:
              print("페이지 토큰 조회 불가 - 기존 토큰 사용")
              data = {"data": []}
          selected = None
          for page in data.get("data", []):
              instagram = page.get("instagram_business_account") or {}
              if str(instagram.get("id", "")) == str(ig_id):
                  selected = page.get("access_token")
                  break
          token = selected or user_token
          print("::add-mask::" + token)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("token=" + token + "\n")
          PY

      - name: 최신 영상 인스타그램 스토리 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ steps.ig_token.outputs.token || secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}
        run: |
          python -u publish.py --story-only --manifest out/uploaded.json --limit 1

      - name: 스토리 발행 기록 저장
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f out/published_instagram_story.json
          git commit -m "인스타그램 스토리 발행 기록" || exit 0
          git pull --rebase --autostash origin main
          git push origin main
