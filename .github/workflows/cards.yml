name: 카드뉴스 생성

# 사진 필수 카드뉴스 생성. 배경음악은 릴스에서만 처리한다.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    if: ${{ false }}
    # 카드뉴스는 현재 운영하지 않는다.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 한글 폰트 · 컬러 이모지 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji
      - name: 의존성 설치
        run: pip install -q Pillow numpy requests opencv-python-headless
      - name: 대본 확인
        run: |
          mkdir -p out/scripts
          COUNT=$(ls out/scripts/*.json 2>/dev/null | wc -l)
          if [ "$COUNT" -eq 0 ]; then echo "::error::대본이 없습니다"; exit 1; fi
          echo "대본 $COUNT 건"
      - name: 배경 사진 수집 (필수)
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: |
          set -euo pipefail
          mkdir -p out/photos
          python -u photos.py out/scripts/*.json -o out/photos 2>&1 | tee out/photos/collect.log
          COUNT=$(find out/photos -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) | wc -l)
          if [ "$COUNT" -eq 0 ]; then echo "::error::사진 수집 결과가 없습니다. 그라데이션 배경으로 대체하지 않습니다."; exit 1; fi
          echo "사진 $COUNT 장 수집 완료"
      - name: 카드뉴스 생성 (사진 필수)
        env:
          IG_HANDLE: "@jjombwabwa"
          IG_BRAND: 쫌봐봐
          CARDNEWS_TEMPLATE: jjombwabwa_v1
        run: |
          set -euo pipefail
          for f in out/scripts/*.json; do
            stem=$(basename "$f" .json)
            PHOTO_DIR="out/photos/$stem"
            PHOTO_COUNT=$(find "$PHOTO_DIR" -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) 2>/dev/null | wc -l)
            if [ "$PHOTO_COUNT" -eq 0 ]; then echo "::error::$stem 사진 없음 — 카드 생성을 중단합니다"; exit 1; fi
            python -u cardnews.py "$f" -o "out/cards_${stem#news_}" -p "$PHOTO_DIR" --layout magazine
          done
          for d in out/cards_*; do
            COUNT=$(find "$d" -maxdepth 1 -name '*.png' | wc -l)
            [ "$COUNT" -eq 7 ] || { echo "::error::$d 카드 수가 7장이 아닙니다 ($COUNT장)"; exit 1; }
          done
          find out -name '*.png' -path '*cards*' | sort
      - name: 카드뉴스 업로드
        uses: actions/upload-artifact@v4
        with:
          name: cardnews
          path: |
            out/cards_*/**
            out/photos/**
          retention-days: 30
      - name: 커밋
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -Af out
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "사진 필수 카드뉴스 생성 $(date +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push origin main
