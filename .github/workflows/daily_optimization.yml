name: 매일 콘텐츠 최적화

on:
  schedule:
    - cron: "40 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 최적화 보고서 생성
        run: python company/daily_optimization.py
      - name: 보고서 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company/optimization_report.json
          git diff --cached --quiet || git commit -m "data: update daily content optimization report"
          git push
