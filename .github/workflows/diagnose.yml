name: 🔬 media_publish 진단
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 계정·토큰·발행 한도 진단
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}
        run: python -u publish.py --check
