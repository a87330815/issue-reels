name: 🏆 주간 TOP3 릴스

on:
  schedule:
    # 매주 일요일 15:30 UTC (한국시간 월요일 00:30)
    - cron: "30 15 * * 0"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: TOP3 스크립트 생성
        run: python weekly_top3.py

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "🏆 주간 TOP3 스크립트 $(date -u +%Y-%m-%d)"
          git push
