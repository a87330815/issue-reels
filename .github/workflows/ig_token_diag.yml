name: 인스타 연결 진단
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: 페이지와 인스타 연결 확인
        env:
          USER_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token=os.environ["USER_TOKEN"]; ig=os.environ["IG_USER_ID"]
          r=requests.get("https://graph.facebook.com/v26.0/me/accounts",params={
            "fields":"id,name,instagram_business_account,connected_instagram_account",
            "limit":100,"access_token":token},timeout=30)
          d=r.json()
          if "error" in d: print("ERROR",d["error"].get("code"),d["error"].get("message")); raise SystemExit(1)
          pages=d.get("data",[])
          print("page_count",len(pages),"target_ig",ig)
          for p in pages:
            a=(p.get("instagram_business_account") or {}).get("id")
            b=(p.get("connected_instagram_account") or {}).get("id")
            print("page",p.get("id"),p.get("name"),"business_ig",a,"connected_ig",b)
          PY