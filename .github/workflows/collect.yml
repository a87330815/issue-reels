name: collect

on:
  schedule:
    # UTC 23:00 = 한국시간 08:00 (다음날)
    - cron: "0 23 * * *"
  workflow_dispatch:

# 수집 로그를 저장소에 커밋하므로 쓰기 권한이 필요하다.
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      # 인증키 없이 점검하면 멀쩡한 소스가 "인증키 없음"으로 찍혀
      # 막힌 것처럼 보인다. 수집과 같은 환경에서 점검해야 실태가 나온다.
      - name: 소스 점검
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: |
          mkdir -p out
          python -u collect.py --verify 2>&1 | tee out/collect.log

      # 러너가 한국 API에 닿는지부터 확인한다. 해외 IP 차단이면 수집기를
      # 고쳐봐야 소용없고, 닿는다면 원인은 다른 데 있다.
      - name: 러너 도달성 점검
        continue-on-error: true
        run: |
          for h in apis.data.go.kr www.korea.kr apihub.kma.go.kr kosis.kr; do
            code=$(curl -sS -o /dev/null -m 20 -w '%{http_code}' "https://$h/" || echo "연결실패")
            echo "$h → $code" | tee -a out/collect.log
          done

      - name: 수집
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KMA_APIHUB_KEY: ${{ secrets.KMA_APIHUB_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: python -u collect.py 2>&1 | tee -a out/collect.log

      # 아티팩트는 이 환경에서 받기 어려워 로그를 저장소로 남긴다.
      - name: 수집 로그 커밋
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 수집물도 저장소에 남긴다. 아티팩트로만 두면 다음 단계인
          # 대본 생성이 집어갈 수 없다.
          for p in out/collect.log out/collected.json out/seen.json; do
            [ -f "$p" ] && git add -f "$p" || true
          done
          git diff --cached --quiet && { echo "커밋할 변경 없음"; exit 0; }
          git commit -m "수집 로그 $(date +%Y-%m-%d\ %H:%M)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep 5
          done
          echo "::error::수집 로그 푸시 실패"; exit 1

      - name: 결과 보관
        uses: actions/upload-artifact@v4
        with:
          name: collected
          path: out/collected.json
          if-no-files-found: ignore
