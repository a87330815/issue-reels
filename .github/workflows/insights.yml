name: 📊 인사이트 수집

on:
  schedule:
    # 매일 15:00 UTC (한국시간 00:00) — 하루 지표 마감 후 수집
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "수집할 최대 미디어 수"
        default: "50"

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: 인사이트 수집
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          python insights.py --limit ${{ github.event.inputs.limit || '50' }}

      - name: CSV 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/insights.csv
          git diff --cached --quiet && echo "변경 없음" && exit 0
          git commit -m "📊 인사이트 수집 $(date -u +%Y-%m-%d)"
          git push
