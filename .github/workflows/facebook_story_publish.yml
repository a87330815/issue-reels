name: 페이스북 스토리 발행

on:
  workflow_dispatch:
  push:
    paths:
      - ".facebook_story_trigger"

permissions:
  contents: write

jobs:
  publish-facebook-story:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 의존성 설치
        run: pip install -q requests
      - name: 최신 릴스 페이스북 스토리 발행
        env:
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN || secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID || vars.FB_PAGE_ID || '1277209758815845' }}
          UPLOAD_MANIFEST: out/uploaded.json
        run: |
          STEM="$(python - <<'PY'
          import json
          d=json.load(open('out/uploaded.json', encoding='utf-8'))
          print(d['items'][0]['name'])
          PY
          )"
          echo "페이스북 스토리 발행 대상: $STEM"
          python -u publish_facebook.py --story-only --script "out/scripts/${STEM}.json"

      - name: 스토리 발행 기록 저장
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f out/published_facebook_story.json
          git commit -m "페이스북 스토리 발행 기록" || exit 0
          git pull --rebase --autostash origin main
          git push origin main
