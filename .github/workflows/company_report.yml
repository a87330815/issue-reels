name: 회사 통합 성과보고

on:
  schedule:
    - cron: "30 15 * * *" # 매일 00:30 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: company-daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 계정별 성과 통합
        run: python -u company_report.py
      - name: 보고서 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/company_report.json data/company_report.md
          git diff --cached --quiet || git commit -m "data: update company performance report"
          git push
