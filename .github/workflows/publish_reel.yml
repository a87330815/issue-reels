name: 릴스 발행

# out/reels/<stem>.mp4 하나를 인스타그램 릴스로 올린다.
# 기존 "발행" 워크플로우는 대본부터 다시 만들고 구 렌더러를 쓴다.
# 여기서는 이미 만들어 둔 릴스를 그대로 올린다.
#
# 실제 계정에 올라가므로 자동 실행하지 않는다. 수동 실행 전용.
on:
  workflow_dispatch:
    inputs:
      stem:
        description: "대본 이름 (out/reels/<stem>.mp4 가 있어야 함)"
        type: string
        required: true
      publish:
        description: "실제로 발행 (끄면 업로드까지만 하고 멈춤)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -q requests

      - name: 입력 확인
        env:
          STEM: ${{ inputs.stem }}
        run: |
          VIDEO="out/reels/${STEM}.mp4"
          SCRIPT="out/scripts/${STEM}.json"
          [ -f "$VIDEO" ]  || { echo "::error::릴스가 없습니다: $VIDEO"; exit 1; }
          [ -f "$SCRIPT" ] || { echo "::error::대본이 없습니다: $SCRIPT"; exit 1; }
          echo "VIDEO=$VIDEO"   >> "$GITHUB_ENV"
          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"
          ls -lh "$VIDEO"

      - name: 설정 점검
        continue-on-error: true
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO || vars.MEDIA_REPO || 'a87330815/issue-reels-media' }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
        run: |
          mkdir -p out
          python -u upload.py --check 2>&1 | tee out/publish_reel.log
          python -u publish.py --check 2>&1 | tee -a out/publish_reel.log

      # 인스타는 공개 URL에서 영상을 가져간다. 저장소 릴리스에 올려 URL을 만든다.
      - name: 스토리지 업로드
        env:
          MEDIA_REPO: ${{ secrets.MEDIA_REPO || vars.MEDIA_REPO || 'a87330815/issue-reels-media' }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
        run: |
          set -o pipefail
          python -u upload.py "$VIDEO" 2>&1 | tee -a out/publish_reel.log
          cat out/uploaded.json

      - name: 인스타 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID || vars.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          # publish.py는 호스트 기본값이 graph.instagram.com인데, 이 계정의
          # 토큰은 페이지 토큰이라 그 호스트에서 파싱되지 않는다
          # ("Cannot parse access token"). 카드뉴스 발행 쪽은 호스트를
          # 자동으로 찾지만 여기는 기본값에 머물러 실패했다.
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}
          # 체크 해제된 boolean은 문자열 "false"로 들어온다. 빈 문자열이 아니라서
          # ${{ inputs.publish && ... }}는 참이 되어 드라이런이 실제 발행이 된다.
          # 식이 아니라 셸에서 문자열로 엄격히 비교한다.
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          set -o pipefail
          FLAG="--dry-run"
          if [ "$PUBLISH_INPUT" = "true" ]; then
            FLAG=""
            echo "::warning::실제 발행 모드입니다 — 계정에 게시됩니다"
          else
            echo "드라이런 — 업로드까지만 하고 발행하지 않습니다"
          fi
          python -u publish.py --script "$SCRIPT" --limit 1 $FLAG 2>&1 \
            | tee -a out/publish_reel.log

      # 러너 로그는 이 환경에서 받기 어려워 저장소로 남긴다.
      - name: 발행 기록 커밋
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in out/publish_reel.log out/uploaded.json out/published.json; do
            [ -f "$p" ] && git add -f "$p" || true
          done
          git diff --cached --quiet && { echo "커밋할 변경 없음"; exit 0; }
          git commit -m "릴스 발행 기록 $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep 5
          done
          echo "::error::발행 기록 푸시 실패"
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publish-reel-log
          path: out/publish_reel.log
          retention-days: 30
