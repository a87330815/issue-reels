name: 🔑 토큰 자동 갱신

# 매주 월요일 UTC 00:00 (KST 09:00)에 토큰 상태 확인 + 필요 시 갱신
# 수동 실행도 가능
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "강제 갱신"
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 토큰 상태 확인 및 갱신
        id: refresh
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          META_APP_ID: ${{ vars.META_APP_ID || '1143191174807326' }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.instagram.com' }}
          FORCE: ${{ inputs.force }}
        run: |
          FLAGS=""
          if [ "$FORCE" = "true" ]; then FLAGS="--force"; fi
          python -u refresh_token.py $FLAGS

      - name: GitHub Secret 업데이트
        if: steps.refresh.outputs.token_refreshed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TOKEN=$(cat /tmp/new_ig_token.txt)
          gh secret set IG_ACCESS_TOKEN --body "$NEW_TOKEN"
          echo "✅ IG_ACCESS_TOKEN 시크릿 업데이트 완료"
