name: 릴스 렌더 (사진 + 음성)

# 클라우드 작업환경은 프록시가 외부 이미지·TTS 서버를 막는다.
# 사진 수집과 edge-tts는 인터넷이 열린 러너에서 돌리고,
# 완성된 mp4를 레포로 되돌려 커밋한다.
on:
  workflow_dispatch:
    inputs:
      stem:
        description: "대본 이름 (out/scripts/<stem>.json)"
        type: string
        required: true
      preset:
        description: "음성 프리셋 (쉼표로 여럿 주면 대본마다 하나를 고름)"
        type: string
        default: "앵커,발랄녀"
      alternate:
        description: "한 영상 안에서 장면마다 목소리 교대 (남녀 번갈아)"
        type: boolean
        default: false
      voice:
        description: "TTS 음성 직접 지정 (비우면 프리셋이 정함)"
        type: string
        default: ""
  push:
    paths:
      - "out/scripts/**.json"

permissions:
  contents: write

concurrency:
  group: render-reel
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # 한 단계가 멈춰도 러너를 오래 붙잡지 않게 한다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -e
          pip install -q Pillow numpy requests edge-tts elevenlabs
          sudo apt-get update -qq || sudo apt-get update -qq
          # 러너에 ffmpeg가 없을 때가 있다. apt가 느리게 걸리는 일이 있어
          # 시간을 끊고, 실패하면 정적 빌드를 받아 쓴다.
          # 한글 폰트는 없으면 카드 생성이 통째로 죽는다. apt가 간헐적으로
          # 실패하므로 두 번 시도하고, 그래도 없으면 직접 받아 설치한다.
          for i in 1 2; do
            sudo timeout 600 apt-get install -y -qq --no-install-recommends \
              fonts-noto-cjk fonts-noto-cjk-extra fonts-noto-color-emoji && break
            echo "::warning::폰트 apt 설치 실패 (시도 $i)"
            sleep 5
          done

          if ! ls /usr/share/fonts/opentype/noto/NotoSansCJK-*.ttc >/dev/null 2>&1; then
            echo "apt로 한글 폰트를 못 받았다 — 직접 내려받는다"
            sudo mkdir -p /usr/share/fonts/opentype/noto
            curl -fsSL -o /tmp/NotoSansCJK.ttc \
              https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/Variable/OTC/NotoSansCJK-VF.otf.ttc
            sudo install -m644 /tmp/NotoSansCJK.ttc \
              /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
            sudo fc-cache -f >/dev/null 2>&1 || true
          fi

          # 폰트가 없으면 여기서 끊는다. 다음 단계에서 PIL 트레이스백으로
          # 죽으면 원인이 폰트라는 걸 알아보기 어렵다.
          ls /usr/share/fonts/opentype/noto/NotoSansCJK-*.ttc \
            || { echo "::error::한글 폰트를 설치하지 못했습니다"; exit 1; }
          sudo timeout 300 apt-get install -y -qq --no-install-recommends ffmpeg \
            || echo "::warning::ffmpeg apt 설치 실패 — 정적 빌드로 넘어갑니다"

          if ! command -v ffprobe >/dev/null; then
            echo "ffprobe 없음 — 정적 빌드 설치"
            curl -fsSL -o /tmp/ff.tar.xz \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
            mkdir -p /tmp/ff && tar -xJf /tmp/ff.tar.xz -C /tmp/ff --strip-components=1
            sudo install -m755 /tmp/ff/ffmpeg /tmp/ff/ffprobe /usr/local/bin/
          fi

          # 앞서 '| head'가 종료코드를 가려 없는 걸 통과시켰다. 여기서 끊는다.
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -version | head -1
          ffprobe -hide_banner -version | head -1

      # push로 들어오면 가장 최근에 바뀐 대본을 고른다.
      - name: 대상 결정
        id: pick
        env:
          IN_STEM: ${{ inputs.stem }}
        run: |
          if [ -n "$IN_STEM" ]; then
            STEM="$IN_STEM"
          else
            STEM="$(git log -1 --name-only --pretty=format: \
              | grep '^out/scripts/.*\.json$' | head -1 \
              | xargs -r basename | sed 's/\.json$//')"
          fi
          if [ -z "$STEM" ] || [ ! -f "out/scripts/${STEM}.json" ]; then
            echo "::error::대본을 찾을 수 없습니다: '${STEM}'"; exit 1
          fi
          echo "stem=$STEM" >> "$GITHUB_OUTPUT"
          echo "대상: $STEM"

      # 러너 로그는 blob 호스트에 있어 작업환경에서 받을 수 없다.
      # 진단에 쓰도록 레포로 함께 커밋한다 (cards.yml과 같은 방식).
      - name: 1) 사진 수집
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          STEM: ${{ steps.pick.outputs.stem }}
        run: |
          set -o pipefail
          mkdir -p out/reels
          echo "run ${{ github.run_id }} $(date -u +%FT%TZ)" > out/reels/render.log
          python -u photos.py "out/scripts/${STEM}.json" 2>&1 \
            | tee -a out/reels/render.log

      - name: 2) 카드 생성 (사진 반영)
        env:
          STEM: ${{ steps.pick.outputs.stem }}
          IG_HANDLE: ${{ vars.IG_HANDLE }}
          IG_BRAND: ${{ vars.IG_BRAND }}
        run: |
          set -o pipefail
          python -u cardnews.py "out/scripts/${STEM}.json" \
            -o "out/cards_${STEM}" -p "out/photos/${STEM}" --reels 2>&1 \
            | tee -a out/reels/render.log

      - name: 3) 릴스 합성 (TTS 음성)
        env:
          STEM: ${{ steps.pick.outputs.stem }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          # push로 들어오면 inputs가 비어 있다. 그때도 남녀가 섞이도록
          # 기본 프리셋 묶음을 둔다.
          PRESET: ${{ inputs.preset || '앵커,발랄녀' }}
          VOICE: ${{ inputs.voice }}
          ALTERNATE: ${{ inputs.alternate }}
        run: |
          set -o pipefail
          ARGS=""
          [ -n "$PRESET" ] && ARGS="$ARGS --preset $PRESET"
          [ -n "$VOICE" ]  && ARGS="$ARGS --voice $VOICE"
          [ "$ALTERNATE" = "true" ] && ARGS="$ARGS --alternate"
          python -u render_reels.py "out/scripts/${STEM}.json" \
            --cards "out/cards_${STEM}" $ARGS --require-tts 2>&1 \
            | tee -a out/reels/render.log
          ls -lh "out/reels/${STEM}.mp4" | tee -a out/reels/render.log

      # 실패해도 돌린다. 로그가 올라와야 원인을 볼 수 있다.
      - name: 결과 커밋
        if: always() && steps.pick.outputs.stem != ''
        env:
          STEM: ${{ steps.pick.outputs.stem }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -Af out/reels out/cards_${STEM} out/photos || true
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          if [ -f "out/reels/${STEM}.mp4" ]; then
            MSG="릴스 렌더 완료: ${STEM} (사진 + 음성)"
          else
            MSG="릴스 렌더 실패 로그: ${STEM}"
          fi
          git commit -m "$MSG"
          # 같은 시간대에 다른 실행이 먼저 밀어넣으면 리베이스가 어긋난다.
          # 결과물은 실행마다 경로가 같아 충돌하므로 우리 쪽을 택한다.
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            if git rebase -X ours origin/main && git push origin main; then
              echo "푸시 완료 (시도 $i)"; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 7))
          done
          echo "::error::푸시 실패"; exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: reel-${{ steps.pick.outputs.stem }}
          path: out/reels/*.mp4
