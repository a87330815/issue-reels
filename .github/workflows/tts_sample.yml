name: tts-sample

# 음성 품질 판정용. 수동 실행하면 mp3를 tts-samples 브랜치에 올린다.
on:
  workflow_dispatch:
    inputs:
      text:
        description: 읽힐 문장
        default: "내년 1월부터 자동차세를 한 번에 내면 할인을 받습니다. 할인율은 해마다 달라지니 확인이 필요합니다."
      voices:
        description: 쉼표로 구분한 음성 목록
        default: "ko-KR-SunHiNeural,ko-KR-InJoonNeural,ko-KR-HyunsuMultilingualNeural"

permissions:
  contents: write

jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install edge-tts

      # 실제로 있는 한국어 음성이 무엇인지 먼저 남긴다. 이름을 잘못 넣으면
      # 생성이 통째로 실패해서 원인을 알기 어려웠다.
      - name: 한국어 음성 목록
        run: |
          mkdir -p samples
          edge-tts --list-voices | grep -i "^ko-KR" | tee samples/_voices.txt || \
            edge-tts --list-voices | head -50

      - name: 음성 생성
        run: |
          mkdir -p samples
          IFS=',' read -ra VS <<< "${{ inputs.voices }}"
          OK=0
          for v in "${VS[@]}"; do
            v="$(echo "$v" | xargs)"   # 앞뒤 공백 제거
            echo "생성 중: $v"
            # 한 음성이 없어도 나머지는 받아야 비교를 할 수 있다.
            if edge-tts --voice "$v" --text "${{ inputs.text }}" \
                 --write-media "samples/$v.mp3"; then
              OK=$((OK + 1))
            else
              echo "::warning::생성 실패(이름 확인 필요): $v"
              rm -f "samples/$v.mp3"
            fi
          done
          ls -la samples/
          [ "$OK" -gt 0 ] || { echo "::error::생성된 음성이 없습니다"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: tts-samples
          path: samples/*.mp3

      - name: tts-samples 브랜치에 올리기
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan tts-samples
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 ! -name samples ! -name .git -exec rm -rf {} +
          git add -f samples/
          git commit -qm "TTS 샘플 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f origin tts-samples
