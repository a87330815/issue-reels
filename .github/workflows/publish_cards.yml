name: 카드뉴스 발행

# 실제 계정에 올라가는 단계라 자동 실행하지 않는다. 수동 실행 전용.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "대본 이름 (out/scripts/<이름>.json)"
        type: string
        required: true
        default: "news_002"
      publish:
        description: "실제로 발행 (끄면 컨테이너까지만 만들고 멈춤)"
        type: boolean
        default: false

# 발행 로그·기록을 저장소에 커밋하므로 쓰기 권한이 필요하다.
# (빠져 있으면 GITHUB_TOKEN이 읽기 전용이라 push가 거부된다)
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -q Pillow requests

      - name: 입력 확인
        run: |
          STEM="${{ inputs.script }}"
          SCRIPT="out/scripts/${STEM}.json"
          CARDS="out/cards_${STEM#news_}"
          PHOTOS="out/photos/${STEM}"
          for p in "$SCRIPT" "$CARDS"; do
            [ -e "$p" ] || { echo "::error::없습니다: $p"; exit 1; }
          done
          echo "SCRIPT=$SCRIPT" >> "$GITHUB_ENV"
          echo "CARDS=$CARDS"   >> "$GITHUB_ENV"
          echo "PHOTOS=$PHOTOS" >> "$GITHUB_ENV"
          echo "대본: $SCRIPT"
          echo "카드: $CARDS ($(ls "$CARDS"/*.png | wc -l)장)"
          echo "발행 여부: ${{ inputs.publish }}"

      - name: 설정 점검
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
        run: python publish_cards.py --check

      - name: 발행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          MEDIA_REPO: ${{ secrets.MEDIA_REPO }}
          MEDIA_TOKEN: ${{ secrets.MEDIA_TOKEN }}
        run: |
          set -o pipefail
          mkdir -p out
          python -u publish_cards.py "$CARDS" \
            --script "$SCRIPT" --photos "$PHOTOS" \
            ${{ inputs.publish && '--publish' || '' }} 2>&1 | tee out/publish_cards.log

      # 아티팩트·러너 로그는 이 환경에서 받기 어려워 저장소로 남긴다.
      # 실패했을 때야말로 로그가 필요하므로 always()로 둔다.
      - name: 발행 기록 커밋
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 한 경로라도 없으면 git add 전체가 실패해 아무것도 스테이징되지 않는다.
          # 드라이런에서는 published_cards.json이 없으므로 하나씩 더한다.
          for p in out/publish_cards.log out/published_cards.json; do
            [ -f "$p" ] && git add -f "$p" || true
          done
          git diff --cached --quiet && { echo "커밋할 변경 없음"; exit 0; }
          git commit -m "카드뉴스 발행 로그 $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && exit 0
            sleep 5
          done
          echo "::error::발행 기록 푸시 실패"
          exit 1

      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-log
          path: out/publish_cards.log
          retention-days: 30
