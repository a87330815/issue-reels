<!doctype html><meta charset="utf-8"><title>TikTok OAuth Token Exchange</title>
<style>body{font:16px sans-serif;max-width:700px;margin:50px auto;padding:20px}label{display:block;margin:14px 0}input{width:100%;padding:10px}button{padding:12px 22px}</style>
<h1>TikTok OAuth Token Exchange</h1>
<form method="post" action="https://open.tiktokapis.com/v2/oauth/token/">
<label>Client key<input name="client_key" required></label>
<label>Client secret<input name="client_secret" type="password" required></label>
<label>Authorization code<input name="code" type="password" required></label>
<input type="hidden" name="grant_type" value="authorization_code">
<input type="hidden" name="redirect_uri" value="https://a87330815.github.io/issue-reels/callback.html">
<button type="submit">Exchange token</button>
</form>
