# 수집 소스 레지스트리
#
# status: live | dead | pending
#   dead    — 폐쇄된 소스. 수집기가 차단한다.
#   pending — 인증키 미발급. 수집기가 건너뛴다.
#
# license: 공공누리 유형. 1유형만 사용 가능.
#   data.go.kr 데이터셋 상세페이지에서 개별 확인 후 기입할 것.
#   미확인 상태는 unknown으로 두면 수집기가 폐기한다.

sources:
  - id: korea_briefing_rss
    name: 정책브리핑 RSS
    status: dead
    reason: 2026-07-01 중단 (저작권 등 권리 보호 사유)

  - id: kma_rss
    name: 기상청 단기·중기예보 RSS
    status: dead
    reason: 2025-03-31 중단. 대체는 kma_apihub

  - id: kca_product_price
    name: 한국소비자원 생필품 가격 정보 (참가격)
    status: live
    endpoint: https://apis.data.go.kr/B551919/ProductPriceInfoService/getProductPriceInfoSvc
    key_env: DATA_GO_KR_KEY
    license: 1                # 공공저작물 출처표시 (제1유형) — 2026-10-19 상세페이지 확인
    approved: 2026-10-19      # 개발계정 자동승인, 만료 2028-10-19
    traffic: 2000             # 일일 호출 한도
    format: XML
    category: 물가
    attribution: 공공데이터포털 · 한국소비자원
    # 조사일은 격주 금요일(biweekly). collect.py가 최근 금요일을 스캔해 자동 결정.
    # XML 태그가 <item> 대신 <iros.openapi.service.vo.goodPriceVO>를 쓴다.
    xml_item_tag: iros.openapi.service.vo.goodPriceVO
    goods:
      - { id: "246", name: "삼겹살" }
      - { id: "224", name: "우유" }
      - { id: "553", name: "신라면" }
      - { id: "302", name: "배추" }
      - { id: "935", name: "대파" }
      - { id: "237", name: "삼양라면" }
    field_map:
      fields:
        inspect_day: goodInspectDay   # 조사일 (YYYYMMDD)
        store_id: entpId              # 판매점 ID
        good_id: goodId               # 상품 ID
        price: goodPrice              # 가격(원)
        input_time: inputDttm         # 입력 시각

  - id: molit_apt_trade
    name: 국토교통부 아파트 매매 실거래가 자료
    status: live              # 2026-10-19 실응답 확인 (probe4)
    endpoint: https://apis.data.go.kr/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade
    key_env: DATA_GO_KR_KEY   # data.go.kr은 계정당 인증키 1개를 공용으로 사용
    license: none             # 이용허락범위 제한 없음 — 2026-10-19 상세페이지 확인
    approved: 2026-10-19      # 개발계정 자동승인, 만료 2028-10-19
    traffic: 10000            # 일일 호출 한도
    format: XML
    category: 주거
    attribution: 공공데이터포털 · 국토교통부
    rows: 100
    # 지역 x 월 조합으로 호출된다. 지역을 늘리면 호출 수가 그만큼 곱해진다.
    # 해외 IP 차단이 간헐적이라 뚫리는 날 많이 받아 버퍼로 쌓아야 한다.
    # 지역을 넓히면 호출 수가 지역 x 월로 늘지만 일일 한도 10,000에 비하면
    # 여유가 크고, 지역이 다양해야 카드 소재도 겹치지 않는다.
    params:
      LAWD_CD:
        - "48250"   # 경남 김해시
        - "48170"   # 경남 진주시
        - "26350"   # 부산 해운대구
        - "26440"   # 부산 강서구
        - "11680"   # 서울 강남구
        - "11650"   # 서울 서초구
        - "11440"   # 서울 마포구
        - "41135"   # 경기 성남시 분당구
        - "41285"   # 경기 고양시 덕양구
        - "28185"   # 인천 연수구
        - "27230"   # 대구 수성구
        - "30230"   # 대전 유성구
      DEAL_YMD:
        - "{this_month}"
        - "{last_month}"
    field_map:
      fields:
        apt: aptNm           # 단지명
        dong: umdNm          # 법정동
        amount: dealAmount   # 거래금액(만원, 콤마 포함)
        area: excluUseAr     # 전용면적(㎡)
        floor: floor         # 층
        build_year: buildYear
        deal_year: dealYear
        deal_month: dealMonth
        deal_day: dealDay
        deal_type: dealingGbn
    note: 특정 단지·개인 식별 방식으로 사용하지 않음 (활용목적 신고 내용)

  - id: google_trends_kr
    name: Google Trends Korea (일간 인기 검색어)
    status: live
    endpoint: https://trends.google.co.kr/trending/rss?geo=KR
    key_env: null              # API 키 불필요
    license: none              # RSS 피드 — 키워드만 수집, 기사 내용 미사용
    format: RSS/XML
    category: 트렌드
    attribution: Google Trends
    note: 키워드만 추출. 뉴스 본문은 수집하지 않음. LLM이 사실만 뽑아 완전히 새 문장으로 대본 생성.
    collector: collect_trends.py

  - id: kma_apihub
    name: 기상청 API 허브
    status: pending
    endpoint: https://apihub.kma.go.kr/
    key_env: KMA_APIHUB_KEY
    license: unknown
    category: 안전
    field_map: {}

  - id: kosis
    name: 통계청 KOSIS 공유서비스
    status: pending
    endpoint: https://kosis.kr/openapi/
    key_env: KOSIS_KEY
    license: unknown
    category: 통계
    field_map: {}
