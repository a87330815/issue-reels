# 재미·공감 주제 시드 (fun_topics.yml)
#
# scriptgen.py --fun 모드에서 읽는다.
# LLM이 이 시드를 받아 완전히 새로운 대본을 생성하므로
# 외부 데이터/저작권 게이트가 불필요하다.
#
# 카테고리: 재미·공감
# 형식: 각 시드는 topic(주제)과 angle(앵글 힌트)로 구성
#
# 주의:
#   - 스포츠 소재 금지 (연예·정치는 허용)
#   - 특정 브랜드 비교·광고성 금지
#   - 부산·경남 사투리 톤에 맞는 공감형 소재 위주

formats:
  - 공감훅        # "나만 그런 거 아니지?" 류
  - TMI훅         # "이거 알면 쓸데없이 똑똑해짐" 류
  - 세대공감      # MZ·X세대 공통 공감
  - 음식공감      # 먹는 것 관련 공감
  - 생활공감      # 일상 속 "맞아 맞아" 포인트

seeds:
  # ── 일상·생활 공감 ──
  - topic: "냉장고 정리"
    angle: "냉장고 깊숙이 숨어있던 소스 유통기한 지난 거 발견했을 때"
    format: 공감훅

  - topic: "택배 알림"
    angle: "배송완료 문자 왔는데 문 앞에 없을 때 멘붕"
    format: 공감훅

  - topic: "알람 5분 더"
    angle: "알람 5개 맞춰놓고 전부 끄고 다시 자는 사람 특징"
    format: 세대공감

  - topic: "장볼 때 계산"
    angle: "마트에서 필요한 거 3개만 사러 갔는데 카트 가득 채우고 나옴"
    format: 공감훅

  - topic: "에어컨 리모컨"
    angle: "여름에 에어컨 온도 놓고 가족끼리 신경전 벌이는 이유"
    format: 생활공감

  - topic: "우산 분실"
    angle: "편의점 우산 사면 그날 비 그치는 법칙"
    format: 공감훅

  - topic: "충전기 자리싸움"
    angle: "가족 충전기 하나로 눈치싸움 하는 집 특징"
    format: 생활공감

  - topic: "세탁기 주머니"
    angle: "세탁기 돌리고 나서 주머니에서 나오는 것들 모음"
    format: 공감훅

  # ── 음식·먹거리 공감 ──
  - topic: "라면 끓이기"
    angle: "라면 물 양 실수해서 국물이 너무 많거나 적을 때"
    format: 음식공감

  - topic: "배달 음식 고민"
    angle: "배달앱 30분 고민하다가 결국 항상 먹던 거 시키는 사람"
    format: 공감훅

  - topic: "국밥 한 그릇"
    angle: "국밥 한 그릇이면 세상 다 가진 것 같은 순간"
    format: 음식공감

  - topic: "과일 고르기"
    angle: "수박 두드려보면서 고르는데 사실 아무 소리나 다 똑같은 거"
    format: TMI훅

  - topic: "냉동실 아이스크림"
    angle: "몰래 숨겨둔 아이스크림 누가 먹었을 때 배신감"
    format: 음식공감

  - topic: "컵라면 물 양"
    angle: "컵라면 선 딱 맞추는 사람 vs 대충 넣는 사람"
    format: 공감훅

  - topic: "식당 웨이팅"
    angle: "맛집 줄 서서 기다리다가 '이게 맞나' 싶은 순간"
    format: 공감훅

  # ── 흥미로운 사실·TMI ──
  - topic: "한국 지하철"
    angle: "한국 지하철이 세계에서 가장 정확한 이유"
    format: TMI훅

  - topic: "손가락 주름"
    angle: "물에 오래 있으면 손가락에 주름 잡히는 진짜 이유"
    format: TMI훅

  - topic: "편의점 삼각김밥"
    angle: "삼각김밥 뜯는 순서 틀려서 김 다 찢어본 사람"
    format: 공감훅

  - topic: "엘리베이터 닫힘 버튼"
    angle: "엘리베이터 닫힘 버튼이 사실 작동 안 하는 곳이 많다"
    format: TMI훅

  - topic: "하품 전염"
    angle: "옆 사람 하품하면 나도 따라 하품하는 과학적 이유"
    format: TMI훅

  - topic: "자판기 잔돈"
    angle: "자판기가 동전 뱉어내는 기준이 따로 있다"
    format: TMI훅

  # ── 계절·날씨 공감 ──
  - topic: "겨울 이불"
    angle: "겨울 아침 이불 밖은 위험하다는 게 과학적 사실인 이유"
    format: 생활공감

  - topic: "여름 선풍기"
    angle: "선풍기 바람 맞으면서 '아~' 하는 게 한국인 DNA인 이유"
    format: 세대공감

  - topic: "장마철 빨래"
    angle: "장마철 빨래 안 마르는 집 vs 하루 만에 뽀송한 집 차이"
    format: 생활공감

  - topic: "봄 미세먼지"
    angle: "미세먼지 나쁨인데 창문 열어야 하나 말아야 하나"
    format: 생활공감

  # ── 세대·직장 공감 ──
  - topic: "카톡 읽씹"
    angle: "카톡 읽고 답 안 하는 게 예의인 세대 vs 무례인 세대"
    format: 세대공감

  - topic: "점심 메뉴"
    angle: "회사에서 점심 뭐 먹을지 고민하는 시간이 업무보다 긴 이유"
    format: 공감훅

  - topic: "월요일 아침"
    angle: "일요일 저녁부터 시작되는 월요병의 과학적 이름"
    format: TMI훅

  - topic: "퇴근 후 침대"
    angle: "퇴근하고 침대에 눕는 순간 세상에서 가장 행복한 이유"
    format: 공감훅

  - topic: "나이 계산"
    angle: "만 나이 통일됐는데 아직도 헷갈리는 상황 모음"
    format: 세대공감

  # ── 생활 꿀팁성 공감 ──
  - topic: "비닐봉지 묶기"
    angle: "비닐봉지 한 손으로 묶는 방법 알면 인생이 바뀜"
    format: TMI훅

  - topic: "양말 짝"
    angle: "빨래할 때 양말 한 짝이 사라지는 미스터리"
    format: 공감훅

  - topic: "핸드폰 배터리"
    angle: "배터리 1%에서 버티는 시간이 99%에서 90% 가는 시간보다 긴 체감"
    format: TMI훅

  - topic: "주차 자리"
    angle: "마트 주차장에서 자리 찾다가 결국 제일 먼 데 세우는 사람"
    format: 공감훅

  - topic: "미용실 소통"
    angle: "미용실에서 '조금만 다듬어주세요' 했는데 결과가 다른 이유"
    format: 공감훅
