# 돈습관·공감 주제 시드 (fun_topics.yml)
#
# scriptgen.py --fun 모드에서 읽는다.
# LLM이 이 시드를 받아 완전히 새로운 대본을 생성하므로
# 외부 데이터/저작권 게이트가 불필요하다.
#
# 카테고리: 돈습관
# 형식: 각 시드는 topic(주제)과 angle(앵글 힌트)로 구성
#
# 주의:
#   - 연예·정치·스포츠·부동산 소재 금지
#   - 특정 금융상품·브랜드 추천·광고성 금지
#   - 부산·경남 사투리 톤에 맞는 돈 관련 공감형 소재 위주

formats:
  - 돈공감        # "나만 이런 거 아니지?" 돈 관련 공감
  - 돈TMI         # "이거 알면 돈 감각이 달라짐" 류
  - 세대공감      # MZ·X세대 돈습관 차이
  - 소비습관      # 소비 패턴 공감
  - 월급공감      # 월급·통장·급여일 관련 공감

seeds:
  # ── 월급·통장 공감 ──
  - topic: "월급날 통장"
    angle: "월급 들어오자마자 자동이체로 순식간에 빠져나가는 통장 잔고"
    format: 월급공감

  - topic: "월급 루틴"
    angle: "월급날 하루만 부자였다가 다음 날부터 거지 모드 돌입하는 패턴"
    format: 월급공감

  - topic: "13월의 월급"
    angle: "연말정산 환급 기대했다가 오히려 토해낸 사람 특징"
    format: 돈공감

  - topic: "통장 쪼개기"
    angle: "통장 5개로 쪼갰는데 결국 한 통장에서만 쓰는 현실"
    format: 돈공감

  - topic: "급여명세서"
    angle: "세전 세후 차이 처음 보고 충격받은 신입 시절"
    format: 월급공감

  # ── 소비 패턴 공감 ──
  - topic: "커피값 계산"
    angle: "하루 5천 원 커피 1년이면 180만 원인데 절대 못 끊는 이유"
    format: 소비습관

  - topic: "배달앱 중독"
    angle: "배달비 아까워서 직접 해먹겠다고 장봤는데 오히려 더 비싼 현실"
    format: 소비습관

  - topic: "충동구매 후회"
    angle: "새벽 감성에 질렀다가 아침에 주문취소 버튼 찾는 사람"
    format: 돈공감

  - topic: "세일 함정"
    angle: "50% 세일이라 샀는데 원래 안 살 물건이었던 거 깨달은 순간"
    format: 소비습관

  - topic: "구독 서비스"
    angle: "안 쓰는 구독료 매달 빠져나가는 거 1년 뒤에 발견한 사람"
    format: 소비습관

  - topic: "편의점 습관"
    angle: "편의점 들어가면 1+1에 홀려서 필요 없는 거 사는 패턴"
    format: 소비습관

  # ── 세대별 돈습관 ──
  - topic: "MZ 재테크"
    angle: "2030은 주식·코인 먼저 vs 4050은 적금 먼저 — 세대별 첫 재테크"
    format: 세대공감

  - topic: "부모님 세대 저축"
    angle: "부모님 세대는 월급 반 저축이 기본이었다는 게 지금은 불가능한 이유"
    format: 세대공감

  - topic: "용돈 기억"
    angle: "어릴 때 받은 용돈 1000원의 가치 vs 지금 1000원의 가치"
    format: 세대공감

  - topic: "현금 vs 카드"
    angle: "현금 쓰면 아끼게 된다는 말이 진짜인지 실험해본 결과"
    format: 세대공감

  # ── 돈 TMI ──
  - topic: "만 원 원가"
    angle: "만 원짜리 지폐 한 장 만드는 데 드는 실제 비용"
    format: 돈TMI

  - topic: "복리의 마법"
    angle: "매달 10만 원 적금 20년이면 얼마 되는지 계산해보면 놀라는 이유"
    format: 돈TMI

  - topic: "카드 수수료"
    angle: "카드 긁을 때마다 가게 사장님이 내는 수수료 구조"
    format: 돈TMI

  - topic: "ATM 수수료"
    angle: "남의 은행 ATM에서 뽑으면 수수료 얼마나 나가는지 모르는 사람 많음"
    format: 돈TMI

  - topic: "동전 가치"
    angle: "1원짜리 동전 만드는 비용이 1원보다 비싼 아이러니"
    format: 돈TMI

  - topic: "라떼 효과"
    angle: "매일 소소하게 새는 돈 모으면 1년에 차 살 수 있다는 계산"
    format: 돈TMI

  # ── 돈 관련 일상 공감 ──
  - topic: "더치페이"
    angle: "더치페이 할 때 100원 단위까지 계산하는 사람 vs 대충 나누는 사람"
    format: 돈공감

  - topic: "가계부 작심삼일"
    angle: "1월 1일 가계부 쓰기 시작해서 1월 5일에 포기하는 패턴"
    format: 돈공감

  - topic: "마이너스 통장"
    angle: "통장 잔고 보기 무서워서 앱 삭제한 적 있는 사람"
    format: 돈공감

  - topic: "경조사비"
    angle: "10월 결혼 시즌 되면 월급보다 축의금이 더 나가는 현실"
    format: 돈공감

  - topic: "택시 vs 버스"
    angle: "택시 탈까 버스 탈까 고민하다 결국 택시 타고 후회하는 루틴"
    format: 돈공감
